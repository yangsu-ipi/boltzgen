# Test file for per-residue amino acid constraints
# This tests the new residue_constraints feature
#
# Usage:
#   boltzgen check example/residue_constraints_test.yaml
#   boltzgen run example/residue_constraints_test.yaml --output test_output/ --steps design inverse_folding --num_designs 50
#
# Note: Use --num_designs 50 (not 5) for statistically meaningful verification.
# With only 5 designs, blacklist constraints have a ~21% false-pass probability.
#
# Note: Supports both string format ("AGS") and list format ([A, G, S])
#       String format is preferred for consistency with sequence/binding_types
#
# Note: A constraint is hard (strictly enforced) unless it carries a positive
#       'weight', which turns it into a soft preference of that strength in
#       log-odds. Soft constraints bias sampling but never forbid a residue,
#       so they cannot be verified from a single design.

entities:
  - protein:
      id: A
      sequence: 14
      residue_constraints:
        # Position 1: Force Alanine only
        - position: 1
          allowed: A

        # Positions 3-5: Exclude Cysteine and Methionine
        - position: 3..5
          disallowed: CM

        # Position 8: Allow only small amino acids
        - position: 8
          allowed: AGS

        # Position 10: Force Proline
        - position: 10
          allowed: P

        # Positions 11-12: Softly prefer small amino acids (others still possible)
        - position: 11..12
          allowed: AGS
          weight: 1.0

        # Position 13: Strongly discourage Tryptophan without forbidding it
        - position: 13
          disallowed: W
          weight: 3.0

        # Position 14: Hard block on Cysteine plus a soft dislike of Methionine
        - position: 14
          disallowed: C
        - position: 14
          disallowed: M
          weight: 1.5

  # Constraints also work for chains loaded from a structure file. There,
  # positions are addressed per chain with 'res_index' (the same convention as
  # binding_types), not with 'position'. Omitting 'res_index' covers the whole
  # chain.
  - file:
      path: 7rpz.cif
      include:
        - chain:
            id: A

      # Redesign a stretch of the loaded chain...
      design:
        - chain:
            id: A
            res_index: 20..27

      # ...and restrict what may be placed there
      residue_constraints:
        - chain:
            id: A
            res_index: 20..27
            disallowed: C # Hard: never Cysteine in the redesigned stretch
        - chain:
            id: A
            res_index: 24
            allowed: H # Hard: this one position must be Histidine
        - chain:
            id: A
            res_index: 25..27
            allowed: AGS
            weight: 1.0 # Soft: prefer small residues, but allow others
